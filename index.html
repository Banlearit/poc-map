<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pipe Pin Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#6b7280; --accent:#0a7cff; --danger:#e5484d; --card:#f4f6f8; --border:#dde1e6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --fg:#e8eaed; --muted:#9aa0a6; --card:#1c2128; --border:#2d333b; } }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Sukhumvit Set","Noto Sans Thai",sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; }
  header { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--border); }
  header h1 { font-size:16px; margin:0; flex:1; }
  header small { color:var(--muted); }
  #map { flex:1; min-height:0; }
  .bar { display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--border); flex-wrap:wrap; }
  button, .btn { appearance:none; border:1px solid var(--border); background:var(--card); color:var(--fg); padding:10px 14px; border-radius:10px; font-size:15px; cursor:pointer; }
  .primary { background:var(--accent); border-color:var(--accent); color:#fff; flex:1; font-weight:600; }
  .danger { color:var(--danger); }
  #status { font-size:13px; color:var(--muted); padding:0 12px 8px; }
  dialog { border:none; border-radius:14px; padding:0; width:min(420px, calc(100vw - 32px)); background:var(--bg); color:var(--fg); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .dlg { padding:16px; display:flex; flex-direction:column; gap:10px; }
  .dlg h2 { margin:0; font-size:17px; }
  .dlg img { width:100%; max-height:220px; object-fit:cover; border-radius:10px; }
  label { font-size:13px; color:var(--muted); display:flex; flex-direction:column; gap:4px; }
  input, select, textarea { font:inherit; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--fg); }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .coord { font-size:12px; color:var(--muted); font-family:ui-monospace,monospace; }
  .popup img { width:200px; max-width:100%; border-radius:8px; display:block; margin-bottom:6px; }
  .popup b { font-size:14px; }
  .popup .meta { font-size:12px; color:#555; }
  #list { max-height:40vh; overflow:auto; }
  .item { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); cursor:pointer; }
  .item img { width:52px; height:52px; object-fit:cover; border-radius:8px; }
  .item div { font-size:14px; }
  .item small { color:var(--muted); display:block; }
  .hint { position:absolute; z-index:1000; top:64px; left:50%; transform:translateX(-50%); background:var(--accent); color:#fff; padding:8px 12px; border-radius:20px; font-size:13px; display:none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🔧 แผนที่จุดวางท่อ <small id="count"></small></h1>
    <button id="btnList">รายการ</button>
  </header>
  <div class="hint" id="hint">แตะบนแผนที่เพื่อวางหมุด</div>
  <div id="map"></div>
  <div class="bar">
    <button class="primary" id="btnShot">📷 ถ่ายรูป + ปักหมุด</button>
    <button id="btnLocate" title="ตำแหน่งฉัน">📍</button>
    <button id="btnManual" title="ปักหมุดเองบนแผนที่">✋</button>
  </div>
  <div id="status">กำลังขอตำแหน่ง GPS…</div>
</div>

<input type="file" id="file" accept="image/*" capture="environment" hidden>

<dialog id="dlgSave">
  <form class="dlg" method="dialog" id="formSave">
    <h2>บันทึกจุดท่อ</h2>
    <img id="preview" alt="">
    <div class="coord" id="coordText"></div>
    <div class="row">
      <label>ประเภท
        <select name="type">
          <option>จุดเจาะท่อ</option>
          <option>ข้อต่อ</option>
          <option>วาล์ว</option>
          <option>ท่อเมน</option>
          <option>มิเตอร์</option>
          <option>อื่น ๆ</option>
        </select>
      </label>
      <label>ความลึก (ซม.)
        <input name="depth" type="number" inputmode="numeric" placeholder="เช่น 40">
      </label>
    </div>
    <label>ขนาดท่อ / วัสดุ
      <input name="pipe" placeholder="เช่น PVC 1 นิ้ว">
    </label>
    <label>บันทึก
      <textarea name="note" rows="2" placeholder="เช่น หน้าบ้านเลขที่ 12 ห่างรั้ว 1 เมตร"></textarea>
    </label>
    <div class="row">
      <button value="cancel" type="submit">ยกเลิก</button>
      <button value="ok" class="primary" type="submit">บันทึก</button>
    </div>
  </form>
</dialog>

<dialog id="dlgList">
  <div class="dlg">
    <h2>จุดที่บันทึกไว้</h2>
    <div id="list"></div>
    <div class="row">
      <button id="btnExport">⬇️ Export</button>
      <label class="btn" style="flex-direction:row;justify-content:center;color:var(--fg)">⬆️ Import<input type="file" id="importFile" accept="application/json" hidden></label>
    </div>
    <button onclick="this.closest('dialog').close()">ปิด</button>
  </div>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
<script>
// ---------- IndexedDB ----------
const DB = (() => {
  let dbp;
  const open = () => dbp ??= new Promise((res, rej) => {
    const r = indexedDB.open('pipe-pins', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('pins', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction('pins', mode); const s = t.objectStore('pins'); const out = fn(s);
    t.oncomplete = () => res(out?.result ?? out); t.onerror = () => rej(t.error); }); };
  return {
    all: () => tx('readonly', s => s.getAll()),
    put: p => tx('readwrite', s => s.put(p)),
    del: id => tx('readwrite', s => s.delete(id)),
  };
})();

// ---------- Map ----------
const map = L.map('map', { zoomControl: true }).setView([13.7563, 100.5018], 13);
const street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: '© Esri' });
street.addTo(map);
L.control.layers({ 'แผนที่': street, 'ดาวเทียม': sat }).addTo(map);

const $ = id => document.getElementById(id);
const statusEl = $('status');
let me = null, meMarker = null, meCircle = null;
const markers = new Map();

// ---------- GPS ----------
function onPos(p) {
  me = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
  statusEl.textContent = `GPS: ${me.lat.toFixed(6)}, ${me.lng.toFixed(6)} (แม่นยำ ±${Math.round(me.acc)} ม.)`;
  if (!meMarker) {
    meMarker = L.circleMarker([me.lat, me.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#0a7cff', fillOpacity: 1 }).addTo(map);
    meCircle = L.circle([me.lat, me.lng], { radius: me.acc, color: '#0a7cff', weight: 1, fillOpacity: .1 }).addTo(map);
    if (!markers.size) map.setView([me.lat, me.lng], 18);
  } else {
    meMarker.setLatLng([me.lat, me.lng]); meCircle.setLatLng([me.lat, me.lng]).setRadius(me.acc);
  }
}
function onPosErr(e) { statusEl.textContent = `ใช้ GPS ไม่ได้: ${e.message} — ใช้ปุ่ม ✋ ปักหมุดเองได้`; }
if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
} else onPosErr({ message: 'อุปกรณ์ไม่รองรับ' });

const getFreshPos = () => new Promise(res => {
  if (!navigator.geolocation) return res(me);
  navigator.geolocation.getCurrentPosition(
    p => { onPos(p); res(me); }, () => res(me),
    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
});

// ---------- Photo ----------
async function compress(file, max = 1280) {
  const img = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s;
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.75);
}

let pending = null; // {lat,lng,acc,source,photo}

$('btnShot').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  statusEl.textContent = 'กำลังอ่านรูปและตำแหน่ง…';
  // 1) Prefer GPS embedded in the photo (EXIF) — works for gallery photos too
  let loc = null;
  try { const g = await exifr.gps(f); if (g?.latitude) loc = { lat: g.latitude, lng: g.longitude, acc: null, source: 'EXIF รูปภาพ' }; } catch {}
  // 2) Otherwise use the phone's current GPS
  if (!loc) { const p = await getFreshPos(); if (p) loc = { ...p, source: 'GPS มือถือ' }; }
  const photo = await compress(f);
  if (!loc) { pending = { photo }; startManual('ไม่พบตำแหน่ง — แตะบนแผนที่ตรงจุดที่วางท่อ'); return; }
  pending = { ...loc, photo }; openSave();
};

// Manual placement (tap on map)
let manual = false;
function startManual(msg = 'แตะบนแผนที่เพื่อวางหมุด') { manual = true; $('hint').textContent = msg; $('hint').style.display = 'block'; }
$('btnManual').onclick = () => { pending = { photo: null }; startManual(); };
map.on('click', e => {
  if (!manual) return;
  manual = false; $('hint').style.display = 'none';
  pending = { ...pending, lat: e.latlng.lat, lng: e.latlng.lng, acc: null, source: 'ปักหมุดเอง' };
  openSave();
});

function openSave() {
  $('preview').style.display = pending.photo ? 'block' : 'none';
  if (pending.photo) $('preview').src = pending.photo;
  $('coordText').textContent = `${pending.lat.toFixed(6)}, ${pending.lng.toFixed(6)} · ${pending.source}` + (pending.acc ? ` ±${Math.round(pending.acc)} ม.` : '');
  $('formSave').reset();
  $('dlgSave').showModal();
}

$('dlgSave').onclose = async () => {
  if ($('dlgSave').returnValue !== 'ok' || !pending) { pending = null; return; }
  const fd = new FormData($('formSave'));
  const pin = { id: crypto.randomUUID(), createdAt: new Date().toISOString(), ...pending,
    type: fd.get('type'), depth: fd.get('depth'), pipe: fd.get('pipe'), note: fd.get('note') };
  pending = null;
  await DB.put(pin); addMarker(pin, true); updateCount();
  statusEl.textContent = 'บันทึกแล้ว ✅';
};

// ---------- Markers ----------
const colors = { 'จุดเจาะท่อ': '#e5484d', 'ข้อต่อ': '#f59e0b', 'วาล์ว': '#10b981', 'ท่อเมน': '#0a7cff', 'มิเตอร์': '#8b5cf6' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function popupHtml(p) {
  const d = new Date(p.createdAt).toLocaleString('th-TH');
  return `<div class="popup">${p.photo ? `<img src="${p.photo}">` : ''}
    <b>${esc(p.type)}</b>${p.depth ? ` · ลึก ${esc(p.depth)} ซม.` : ''}<br>
    ${p.pipe ? esc(p.pipe) + '<br>' : ''}${p.note ? esc(p.note) + '<br>' : ''}
    <div class="meta">${d}<br>${p.lat.toFixed(6)}, ${p.lng.toFixed(6)} (${esc(p.source)})</div>
    <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}">🧭 นำทางไปจุดนี้</a> ·
    <a href="#" data-del="${p.id}" style="color:#e5484d">ลบ</a></div>`;
}
function addMarker(p, open) {
  const m = L.circleMarker([p.lat, p.lng], { radius: 10, color: '#fff', weight: 2, fillColor: colors[p.type] || '#6b7280', fillOpacity: .95 })
    .bindPopup(popupHtml(p)).addTo(map);
  markers.set(p.id, m);
  if (open) { map.setView([p.lat, p.lng], Math.max(map.getZoom(), 18)); m.openPopup(); }
}
map.on('popupopen', e => {
  const a = e.popup.getElement().querySelector('[data-del]');
  if (a) a.onclick = async ev => { ev.preventDefault();
    if (!confirm('ลบจุดนี้?')) return;
    const id = a.dataset.del; await DB.del(id); markers.get(id)?.remove(); markers.delete(id); updateCount(); };
});
const updateCount = () => $('count').textContent = markers.size ? `(${markers.size} จุด)` : '';

$('btnLocate').onclick = () => me ? map.setView([me.lat, me.lng], 18) : getFreshPos();

// ---------- List / export ----------
$('btnList').onclick = async () => {
  const pins = (await DB.all()).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  $('list').innerHTML = pins.length ? pins.map(p => `<div class="item" data-id="${p.id}">
    ${p.photo ? `<img src="${p.photo}">` : '<div style="width:52px;height:52px;border-radius:8px;background:var(--card)"></div>'}
    <div>${esc(p.type)} ${p.note ? '· ' + esc(p.note) : ''}<small>${new Date(p.createdAt).toLocaleString('th-TH')}</small></div></div>`).join('')
    : '<p style="color:var(--muted)">ยังไม่มีจุด — กด 📷 เพื่อเริ่ม</p>';
  $('list').querySelectorAll('.item').forEach(el => el.onclick = () => {
    $('dlgList').close(); const m = markers.get(el.dataset.id); map.setView(m.getLatLng(), 19); m.openPopup(); });
  $('dlgList').showModal();
};
$('btnExport').onclick = async () => {
  const blob = new Blob([JSON.stringify(await DB.all())], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `pipe-pins-${new Date().toISOString().slice(0, 10)}.json`; a.click();
};
$('importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const pins = JSON.parse(await f.text());
  for (const p of pins) { await DB.put(p); if (!markers.has(p.id)) addMarker(p); }
  updateCount(); $('dlgList').close();
};

// ---------- Init ----------
DB.all().then(pins => {
  pins.forEach(p => addMarker(p));
  updateCount();
  if (pins.length) map.fitBounds(L.latLngBounds(pins.map(p => [p.lat, p.lng])).pad(0.3), { maxZoom: 18 });
});
</script>
</body>
</html>
