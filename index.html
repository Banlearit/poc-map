<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6f7e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>แผนที่จุดท่อ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --font: "Anuphan", system-ui, -apple-system, "Noto Sans Thai", sans-serif;
    --ink: oklch(0.22 0.025 235);
    --ink-2: oklch(0.45 0.025 235);
    --paper: oklch(0.995 0.003 235);
    --paper-2: oklch(0.96 0.008 235);
    --line: oklch(0.90 0.01 235);
    --accent: oklch(0.50 0.105 215);
    --accent-ink: oklch(0.99 0.01 215);
    --accent-soft: oklch(0.94 0.04 215);
    --danger: oklch(0.52 0.19 25);
    --ok: oklch(0.58 0.14 155);
    --warn: oklch(0.72 0.15 75);
    --bad: oklch(0.58 0.2 25);
    --shadow: 0 1px 2px oklch(0.2 0.03 235 / .12), 0 8px 24px -6px oklch(0.2 0.03 235 / .28);
    --ease: cubic-bezier(.16, 1, .3, 1);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--paper-2); color: var(--ink); font-family: var(--font); overscroll-behavior: none; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  input, textarea, select { caret-color: var(--accent); accent-color: var(--accent); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  #map { position: fixed; inset: 0; background: var(--paper-2); }
  #map.picking { cursor: crosshair; }
  .leaflet-control-attribution { font: 10px var(--font); background: color-mix(in oklab, var(--paper) 80%, transparent) !important; color: var(--ink-2); border-radius: 6px 6px 0 0; }
  .leaflet-control-attribution a { color: var(--ink-2); }


  /* ---------- overlay chrome ---------- */
  .ui { position: fixed; z-index: 800; pointer-events: none; }
  .ui > * { pointer-events: auto; }
  .top { top: calc(12px + var(--safe-t)); left: 12px; right: 12px; display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
  .pill { display: inline-flex; align-items: center; gap: 10px; background: var(--paper); border-radius: 999px; box-shadow: var(--shadow); padding: 8px 14px 8px 8px; min-height: 44px; }
  .brand { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .brand .i { width: 17px; height: 17px; }
  .pill h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; line-height: 1.1; }
  .pill small { display: block; font-size: 12px; color: var(--ink-2); font-weight: 400; margin-top: 1px; font-variant-numeric: tabular-nums; }
  .gps { padding: 0 14px; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; border: 0; color: var(--ink); font-family: inherit; cursor: pointer; }
  .gps i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-2); display: block; }
  .gps[data-q=ok] i { background: var(--ok); outline: 4px solid color-mix(in oklab, var(--ok) 25%, transparent); }
  .gps[data-q=mid] i { background: var(--warn); outline: 4px solid color-mix(in oklab, var(--warn) 30%, transparent); }
  .gps[data-q=bad] i { background: var(--bad); outline: 4px solid color-mix(in oklab, var(--bad) 25%, transparent); }
  .gps[data-q=search] i { animation: blink 1.1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  .side { right: 12px; bottom: calc(112px + var(--safe-b)); display: flex; flex-direction: column; gap: 10px; transition: transform .35s var(--ease), opacity .25s; }
  .fab { width: 48px; height: 48px; border-radius: 16px; border: 0; background: var(--paper); color: var(--ink); box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; transition: transform .15s var(--ease), background .15s; font-family: inherit; }
  .fab:active { transform: scale(.94); }
  .fab[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); }

  .bottom { left: 12px; right: 12px; bottom: calc(22px + var(--safe-b)); display: flex; gap: 10px; max-width: 520px; margin: 0 auto; transition: transform .35s var(--ease), opacity .25s; }
  .shoot { flex: 1; height: 60px; border: 0; border-radius: 20px; background: var(--accent); color: var(--accent-ink); font: 600 17px var(--font); display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: var(--shadow); cursor: pointer; transition: transform .15s var(--ease), filter .15s; }
  .shoot:hover { filter: brightness(1.06); }
  .shoot:active { transform: scale(.975); }
  .shoot .i { width: 26px; height: 26px; }
  .listbtn { height: 60px; min-width: 60px; padding: 0 16px; border: 0; border-radius: 20px; background: var(--paper); color: var(--ink); box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; font: 600 15px var(--font); cursor: pointer; font-variant-numeric: tabular-nums; }
  .listbtn:active { transform: scale(.96); }
  body.sheet-open .bottom, body.sheet-open .side { transform: translateY(140%); opacity: 0; pointer-events: none; }

  .coach { left: 12px; right: 72px; bottom: calc(96px + var(--safe-b)); max-width: 520px; margin: 0 auto; background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 16px; font-size: 14px; line-height: 1.45; color: var(--ink-2); display: none; }
  .coach b { color: var(--ink); font-weight: 600; display: block; font-size: 15px; margin-bottom: 2px; }
  body.empty:not(.sheet-open):not(.picking-on) .coach { display: block; animation: rise .5s var(--ease) both; }

  .banner { top: calc(68px + var(--safe-t)); left: 12px; right: 12px; margin: 0 auto; max-width: 460px; display: none; }
  .banner div { background: var(--ink); color: var(--paper); border-radius: 16px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow); }
  .banner span { flex: 1; }
  .banner button { border: 0; background: color-mix(in oklab, var(--paper) 22%, transparent); color: inherit; border-radius: 10px; padding: 8px 12px; font: 600 13px var(--font); cursor: pointer; }
  body.picking-on .banner { display: block; animation: rise .35s var(--ease) both; }
  body.picking-on .bottom, body.picking-on .side { opacity: .35; pointer-events: none; }

  .toast { top: calc(68px + var(--safe-t)); left: 0; right: 0; display: flex; justify-content: center; }
  .toast div { background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 500; padding: 10px 16px; border-radius: 999px; box-shadow: var(--shadow); opacity: 0; transform: translateY(-8px); transition: opacity .25s, transform .35s var(--ease); }
  .toast div.on { opacity: 1; transform: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }

  /* ---------- sheets ---------- */
  .sheet { background: var(--paper); color: var(--ink); border-radius: 26px 26px 0 0; box-shadow: 0 -2px 4px oklch(0.2 0.03 235 / .08), 0 -16px 48px -12px oklch(0.2 0.03 235 / .35); }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 10px auto 2px; }
  .sheet h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.015em; }

  #detail { position: fixed; z-index: 900; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; max-height: 82dvh; overflow: auto; transform: translateY(105%); transition: transform .4s var(--ease); padding: 0 18px calc(18px + var(--safe-b)); }
  #detail.on { transform: none; }
  .d-head { display: flex; align-items: center; gap: 10px; padding: 8px 0 12px; }
  .d-head h2 { flex: 1; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--paper-2); color: var(--ink); display: grid; place-items: center; cursor: pointer; flex: none; }
  .icon-btn:hover { background: var(--line); }
  .d-photo { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 18px; display: block; background: var(--paper-2); margin-bottom: 14px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .fact { background: var(--paper-2); border-radius: 14px; padding: 10px 12px; }
  .fact span { display: block; font-size: 12px; color: var(--ink-2); }
  .fact b { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .note { font-size: 15px; line-height: 1.5; margin: 0 0 12px; white-space: pre-wrap; }
  .meta { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; margin-bottom: 16px; line-height: 1.5; }
  .actions { display: flex; gap: 8px; }
  .btn { height: 52px; border-radius: 16px; border: 0; padding: 0 18px; font: 600 15px var(--font); display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background: var(--paper-2); color: var(--ink); text-decoration: none; transition: transform .15s var(--ease), background .15s; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1; }
  .btn.danger { color: var(--danger); }
  .btn.danger.arm { background: var(--danger); color: var(--paper); }

  dialog { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 520px; max-height: 92dvh; background: transparent; color: var(--ink); overflow: visible; }
  dialog[open] { animation: slideUp .4s var(--ease); }
  dialog::backdrop { background: oklch(0.15 0.03 235 / .5); animation: fade .3s; }
  @keyframes slideUp { from { transform: translateY(100%); } }
  @keyframes fade { from { opacity: 0; } }
  .dlg { padding: 0 18px calc(18px + var(--safe-b)); display: flex; flex-direction: column; gap: 14px; max-height: 92dvh; overflow: auto; }
  .dlg header { display: flex; align-items: center; gap: 10px; padding-top: 6px; }
  .dlg header h2 { flex: 1; }
  .shot { display: flex; gap: 12px; align-items: center; }
  .shot img { width: 76px; height: 76px; object-fit: cover; border-radius: 14px; flex: none; }
  .where { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; line-height: 1.5; }
  .where b { color: var(--ink); font-weight: 600; display: block; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .chip span { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; border-radius: 999px; background: var(--paper-2); font-size: 14.5px; font-weight: 500; border: 2px solid transparent; transition: background .15s, border-color .15s; }
  .chip input:checked + span { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
  .chip input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .field input, .field textarea { font: 400 16px var(--font); color: var(--ink); background: var(--paper-2); border: 2px solid transparent; border-radius: 14px; padding: 12px 14px; width: 100%; resize: none; }
  .field input::placeholder, .field textarea::placeholder { color: var(--ink-2); }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); background: var(--paper); }
  .two { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
  .foot { display: flex; gap: 8px; }

  /* list */
  .filters { display: flex; gap: 8px; overflow-x: auto; margin: 0 -18px; padding: 2px 18px 4px; scrollbar-width: none; }
  .filters button { flex: none; height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--paper-2); color: var(--ink); font: 500 14px var(--font); display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
  .filters button[aria-pressed=true] { background: var(--ink); color: var(--paper); }
  #list { overflow: auto; max-height: 46dvh; margin: 0 -18px; padding: 0 10px; }
  .item { display: flex; gap: 12px; align-items: center; padding: 8px; border-radius: 16px; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; font-family: inherit; color: inherit; }
  .item:hover, .item:focus-visible { background: var(--paper-2); }
  .item .th { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; background: var(--paper-2); flex: none; display: grid; place-items: center; color: var(--ink-2); }
  .item .tx { flex: 1; min-width: 0; }
  .item b { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .item p { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .dist { font-size: 13px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; flex: none; }
  .empty-list { text-align: center; padding: 28px 12px; color: var(--ink-2); font-size: 14.5px; line-height: 1.5; }

  /* AR view */
  #ar { position: fixed; inset: 0; z-index: 880; background: oklch(0.2 0.02 235); overflow: hidden; }
  #ar[hidden] { display: none; }
  #ar.nocam { background: linear-gradient(oklch(0.34 0.04 235), oklch(0.22 0.03 235)); }
  #arVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #arLayer { position: absolute; inset: 0; overflow: hidden; }
  .ar-top { position: absolute; z-index: 5; top: calc(12px + var(--safe-t)); left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; }
  .ar-close { width: 44px; height: 44px; background: var(--paper); box-shadow: var(--shadow); }
  .ar-hud { flex: 1; justify-content: center; padding: 10px 14px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; gap: 10px; }
  .ar-hud .sep { width: 1px; height: 16px; background: var(--line); }
  .ar-range { padding: 0 14px; border: 0; font: 500 14px var(--font); color: var(--ink); cursor: pointer; gap: 6px; white-space: nowrap; }
  .ar-hint { position: absolute; z-index: 5; left: 12px; right: 12px; bottom: calc(24px + var(--safe-b)); max-width: 460px; margin: 0 auto; background: var(--ink); color: var(--paper); border-radius: 16px; padding: 12px 16px; font-size: 14px; line-height: 1.45; box-shadow: var(--shadow); text-align: center; }
  .ar-hint:empty { display: none; }
  .btn.sm { height: 44px; padding: 0 14px; font-size: 14px; border-radius: 14px; }
  .btn:disabled { opacity: .4; pointer-events: none; }
  .ar-calbtn { position: absolute; z-index: 5; right: 12px; bottom: calc(92px + var(--safe-b)); padding: 10px 16px; border: 0; font: 600 14px var(--font); color: var(--ink); cursor: pointer; }
  .ar-calbtn[hidden], .ar-cal[hidden] { display: none; }
  .ar-cal { position: absolute; z-index: 6; left: 12px; right: 12px; bottom: calc(16px + var(--safe-b)); max-width: 460px; margin: 0 auto; background: var(--paper); border-radius: 22px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .cal-h { display: flex; align-items: center; justify-content: space-between; }
  .cal-h b { font-size: 16px; font-weight: 600; }
  .cal-t { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.45; }
  .cal-row { display: flex; align-items: center; gap: 10px; background: var(--paper-2); border-radius: 16px; padding: 10px 10px 10px 14px; }
  .cal-row > div { flex: 1; min-width: 0; }
  .cal-row span { display: block; font-size: 13px; font-weight: 600; }
  .cal-row small { display: block; font-size: 12.5px; color: var(--ink-2); line-height: 1.35; margin-top: 2px; }
  .cal-s { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .ar-m { position: absolute; left: 0; top: 0; z-index: 2; border: 0; padding: 0; background: none; font-family: inherit; color: var(--ink); cursor: pointer; will-change: transform; display: flex; flex-direction: column; align-items: center; width: 0; height: 0; }
  .ar-m[hidden] { display: none; }
  .ar-card { position: absolute; bottom: 44px; left: 0; translate: -50% 0; display: flex; align-items: center; gap: 8px; background: var(--paper); border-radius: 14px; padding: 5px 12px 5px 5px; box-shadow: var(--shadow); white-space: nowrap; }
  .ar-card img { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; }
  .ar-card .nm { display: flex; flex-direction: column; text-align: left; line-height: 1.2; padding-left: 7px; }
  .ar-card img + .nm { padding-left: 0; }
  .ar-card b { font-size: 14px; font-weight: 600; }
  .ar-card small { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .ar-card .chev { display: none; width: 18px; height: 18px; }
  .ar-glyph { position: absolute; left: -15px; bottom: 0; width: 30px; height: 38px; filter: drop-shadow(0 3px 3px oklch(0.2 0.03 235 / .4)); }
  .ar-m.edge .ar-card { padding: 7px 12px; bottom: 0; translate: 0 -50%; }
  .ar-m.edge .ar-card img, .ar-m.edge .ar-glyph { display: none; }
  .ar-m.edge .ar-card .chev { display: block; }
  .ar-m.edge.l .ar-card { left: 0; translate: 0 -50%; flex-direction: row-reverse; }
  .ar-m.edge.l .ar-card .chev { rotate: 180deg; }
  .ar-m.edge.r .ar-card { left: auto; right: 0; translate: 0 -50%; }
  .ar-m.edge .ar-card .nm { padding-left: 0; }
  .ar-m.edge .ar-card b { display: none; }

  /* map pins */
  .pin { transition: transform .25s var(--ease); transform-origin: 50% 100%; filter: drop-shadow(0 3px 3px oklch(0.2 0.03 235 / .35)); }
  .pin.sel { transform: scale(1.3); z-index: 999 !important; }
  .me-ring { animation: ring 2.4s ease-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes ring { 0% { opacity: .5; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.8); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>

<div id="map"></div>

<div class="ui top">
  <div class="pill">
    <span class="brand"><svg class="i"><use href="#i-drop"/></svg></span>
    <div><h1>แผนที่จุดท่อ</h1><small id="count">ยังไม่มีจุด</small></div>

    <div class="shot"><img id="preview" alt="รูปที่ถ่าย" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="><div class="where" id="coordText"></div></div>

    <div class="filters" id="filters"></div>
    <div id="list"></div>

      <button class="btn" id="btnExport" style="flex:1"><svg class="i"><use href="#i-down"/></svg>สำรองข้อมูล</button>
      <label class="btn" style="flex:1"><svg class="i"><use href="#i-up"/></svg>นำเข้า<input type="file" id="importFile" accept="application/json" hidden></label>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
<script>
// ---------- helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TYPES = [
  { k: 'จุดเจาะท่อ', c: 'oklch(0.58 0.2 25)' },
  { k: 'ข้อต่อ',     c: 'oklch(0.72 0.16 70)' },
  { k: 'วาล์ว',      c: 'oklch(0.6 0.14 155)' },
  { k: 'ท่อเมน',     c: 'oklch(0.55 0.17 255)' },
  { k: 'มิเตอร์',    c: 'oklch(0.55 0.18 305)' },
  { k: 'อื่น ๆ',      c: 'oklch(0.55 0.02 235)' },
];
const colorOf = t => (TYPES.find(x => x.k === t) || TYPES[5]).c;
const fmtDate = iso => new Date(iso).toLocaleString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' });
const fmtDist = m => m < 1000 ? `${Math.round(m)} ม.` : `${(m / 1000).toFixed(1)} กม.`;
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }

// ---------- IndexedDB ----------
const DB = (() => {
  let dbp;
  const open = () => dbp ??= new Promise((res, rej) => {
    const r = indexedDB.open('pipe-pins', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('pins', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction('pins', mode); const out = fn(t.objectStore('pins'));
    t.oncomplete = () => res(out?.result ?? out); t.onerror = () => rej(t.error); }); };
  return { all: () => tx('readonly', s => s.getAll()), put: p => tx('readwrite', s => s.put(p)), del: id => tx('readwrite', s => s.delete(id)) };
})();

// ---------- Map ----------
const map = L.map('map', { zoomControl: false, attributionControl: false, tapTolerance: 15 }).setView([13.7563, 100.5018], 13);
L.control.attribution({ position: 'bottomleft', prefix: false }).addTo(map);
const OFM = 'https://tiles.openfreemap.org/styles/';
const vec = {}; // vector basemaps, created on demand
const vecLayer = name => vec[name] ??= L.maplibreGL({ style: OFM + name, attribution: '© OpenStreetMap · OpenFreeMap © OpenMapTiles' });
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: '© Esri' });
let useSat = false, styleLight = 'positron';
function applyBase() {
  [sat, ...Object.values(vec)].forEach(l => map.hasLayer(l) && map.removeLayer(l));
  (useSat ? sat : vecLayer(styleLight)).addTo(map);
}
applyBase();
$('btnSat').onclick = () => { useSat = !useSat; $('btnSat').setAttribute('aria-pressed', useSat); applyBase(); };

const markers = new Map(), pinData = new Map();
let me = null, meMarker = null, meCircle = null, selected = null;

// ---------- GPS ----------
const fixes = []; // recent GPS fixes, used to average out random noise
function onPos(p) {
  me = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
  const now = Date.now(); fixes.push({ ...me, t: now });
  while (fixes.length && (now - fixes[0].t > 130000 || fixes.length > 60)) fixes.shift();
  const q = me.acc <= 10 ? 'ok' : me.acc <= 30 ? 'mid' : 'bad';
  $('gps').dataset.q = q; $('gpsText').textContent = `±${Math.round(me.acc)} ม.`;
  if (!meMarker) {
    meCircle = L.circle([me.lat, me.lng], { radius: me.acc, color: '#0b7a8a', weight: 1, fillOpacity: .1, interactive: false }).addTo(map);
    meMarker = L.marker([me.lat, me.lng], { interactive: false, zIndexOffset: 500, icon: L.divIcon({ className: '', iconSize: [28, 28], iconAnchor: [14, 14],
      html: '<svg viewBox="0 0 28 28" width="28" height="28"><circle class="me-ring" cx="14" cy="14" r="13" fill="#0b7a8a"/><circle cx="14" cy="14" r="8" fill="#fff"/><circle cx="14" cy="14" r="5.5" fill="#0b7a8a"/></svg>' }) }).addTo(map);
    if (!markers.size) map.setView([me.lat, me.lng], 18);
  } else { meMarker.setLatLng([me.lat, me.lng]); meCircle.setLatLng([me.lat, me.lng]).setRadius(me.acc); }
}
function onPosErr(e) { $('gps').dataset.q = 'bad'; $('gpsText').textContent = 'ไม่มี GPS'; if (e.code === 1) toast('ยังไม่ได้อนุญาตตำแหน่ง · ใช้ปุ่มปักหมุดเองได้'); }
if ('geolocation' in navigator) navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
else onPosErr({});
const getFreshPos = () => new Promise(res => {
  if (!navigator.geolocation) return res(me);
  navigator.geolocation.getCurrentPosition(p => { onPos(p); res(me); }, () => res(me), { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
});
// Weighted mean of recent fixes (weight 1/acc^2). Random error shrinks ~1/sqrt(N); a shared bias does not.
function avgPos(windowMs = 12000) {
  const now = Date.now(), f = fixes.filter(x => now - x.t <= windowMs && x.acc > 0);
  if (!f.length) return null;
  const best = Math.min(...f.map(x => x.acc)), use = f.filter(x => x.acc <= best * 2.5);
  let sw = 0, la = 0, ln = 0;
  for (const x of use) { const w = 1 / (x.acc * x.acc); sw += w; la += w * x.lat; ln += w * x.lng; }
  return { lat: la / sw, lng: ln / sw, acc: Math.max(best * 0.6, 1 / Math.sqrt(sw)), n: use.length };
}
// iOS only reports when you move; if you stand still keep using the last fixes instead of losing the position
function livePos() { return avgPos(8000) || avgPos(120000) || (me ? { ...me, n: 1 } : null); }
// wait a few seconds so there are enough fixes to average
async function collectPos(minN = 4, maxMs = 5000) {
  const t0 = Date.now(); let shown = false;
  while (Date.now() - t0 < maxMs) {
    const a = avgPos(10000); if (a && a.n >= minN) return a;
    if (!shown && Date.now() - t0 > 600) { toast('กำลังเฉลี่ยตำแหน่ง GPS…'); shown = true; }
    await new Promise(r => setTimeout(r, 250));
  }
  return avgPos(15000);
}
$('btnLocate').onclick = () => me ? map.flyTo([me.lat, me.lng], Math.max(map.getZoom(), 18), { duration: .6 }) : getFreshPos();
$('gps').onclick = $('btnLocate').onclick;

// ---------- Photo ----------
async function compress(file, max = 1280) {
  const img = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s;
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.75);
}
let pending = null;

$('btnShot').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  toast('กำลังอ่านรูปและตำแหน่ง…');
  let loc = null, taken = null;
  try { const t = await exifr.parse(f, ['DateTimeOriginal', 'CreateDate']); taken = t?.DateTimeOriginal || t?.CreateDate || null; } catch {}
  // a photo taken just now was taken where we stand -> average live GPS (more accurate than one EXIF fix);
  // an older photo (gallery) keeps the position stored in the photo itself
  const justNow = !taken || Math.abs(Date.now() - new Date(taken).getTime()) < 3 * 60 * 1000;
  if (!justNow) { try { const g = await exifr.gps(f); if (g?.latitude) loc = { lat: g.latitude, lng: g.longitude, acc: null, source: 'GPS ในรูป' }; } catch {} }
  if (!loc) { let a = await collectPos(); if (!a) { await getFreshPos(); a = avgPos(); } if (a) loc = { lat: a.lat, lng: a.lng, acc: a.acc, source: a.n > 1 ? `GPS เฉลี่ย ${a.n} ครั้ง` : 'GPS มือถือ' }; }
  if (!loc) { try { const g = await exifr.gps(f); if (g?.latitude) loc = { lat: g.latitude, lng: g.longitude, acc: null, source: 'GPS ในรูป' }; } catch {} }
  const photo = await compress(f);
  if (!loc) { pending = { photo }; startManual('ไม่พบตำแหน่ง · แตะแผนที่ตรงจุดที่วางท่อ'); return; }
  pending = { ...loc, photo }; openSave();
};

// manual placement
let manual = false;
function startManual(msg = 'แตะบนแผนที่ตรงจุดที่วางท่อ') {
  manual = true; closeDetail(); $('bannerText').textContent = msg;
  document.body.classList.add('picking-on'); $('map').classList.add('picking');
}
function stopManual() { manual = false; document.body.classList.remove('picking-on'); $('map').classList.remove('picking'); }
$('btnManual').onclick = () => { pending = { photo: null }; startManual(); };
$('bannerCancel').onclick = () => { stopManual(); pending = null; };
map.on('click', e => {
  if (manual) { stopManual(); pending = { ...pending, lat: e.latlng.lat, lng: e.latlng.lng, acc: null, source: 'ปักเองบนแผนที่' }; openSave(); }
  else closeDetail();
});

// ---------- Save sheet ----------
$('typeChips').innerHTML = TYPES.map((t, i) => `<label class="chip"><input type="radio" name="type" value="${t.k}" ${i ? '' : 'checked'}><span><i class="dot" style="background:${t.c}"></i>${t.k}</span></label>`).join('');
function openSave() {
  $('formSave').reset();
  const img = $('preview'); img.style.display = pending.photo ? '' : 'none'; if (pending.photo) img.src = pending.photo;
  $('coordText').innerHTML = `<b>${esc(pending.source)}${pending.acc ? ` · ±${Math.round(pending.acc)} ม.` : ''}</b>${pending.lat.toFixed(6)}, ${pending.lng.toFixed(6)}`;
  document.body.classList.add('sheet-open');
  $('dlgSave').showModal();
}
$('dlgSave').addEventListener('close', async () => {
  document.body.classList.remove('sheet-open');
  if ($('dlgSave').returnValue !== 'ok' || !pending) { pending = null; return; }
  const fd = new FormData($('formSave'));
  const pin = { id: crypto.randomUUID(), createdAt: new Date().toISOString(), ...pending,
    type: fd.get('type'), depth: fd.get('depth'), pipe: fd.get('pipe'), note: fd.get('note') };
  pending = null;
  await DB.put(pin); addMarker(pin); refresh(); select(pin.id, true); toast('บันทึกแล้ว');
});

// ---------- Markers + detail ----------
const pinIcon = (type, sel) => L.divIcon({ className: '', iconSize: [34, 42], iconAnchor: [17, 41],
  html: `<svg class="pin ${sel ? 'sel' : ''}" viewBox="0 0 34 42" width="34" height="42"><path d="M17 41S3.500 26 3.500 16a13.500 13.500 0 0 1 27 0C30.500 26 17 41 17 41z" fill="${colorOf(type)}" stroke="#fff" stroke-width="2.500"/><circle cx="17" cy="16" r="5.500" fill="#fff"/></svg>` });
function addMarker(p) {
  pinData.set(p.id, p);
  const m = L.marker([p.lat, p.lng], { icon: pinIcon(p.type), riseOnHover: true, keyboard: true, title: p.type }).addTo(map);
  m.on('click', e => { L.DomEvent.stop(e); select(p.id, false); });
  markers.set(p.id, m);
}
function select(id, fly) {
  if (selected && markers.has(selected)) markers.get(selected).setIcon(pinIcon(pinData.get(selected).type, false));
  selected = id; const p = pinData.get(id), m = markers.get(id);
  m.setIcon(pinIcon(p.type, true));
  openDetail(p);
  const target = map.project(m.getLatLng(), Math.max(map.getZoom(), fly ? 18 : 0)).add([0, innerHeight * 0.2]);
  map.flyTo(map.unproject(target, Math.max(map.getZoom(), fly ? 18 : 0)), Math.max(map.getZoom(), fly ? 18 : map.getZoom()), { duration: .5 });
}
function openDetail(p) {
  const d = $('detail');
  const dist = me ? fmtDist(L.latLng(me.lat, me.lng).distanceTo([p.lat, p.lng])) : null;
  d.innerHTML = `<div class="grab"></div>
    <div class="d-head"><span class="dot" style="background:${colorOf(p.type)}"></span><h2>${esc(p.type)}</h2>
      <button class="icon-btn" id="dClose" aria-label="ปิด"><svg class="i"><use href="#i-x"/></svg></button></div>
    ${p.photo ? `<img class="d-photo" src="${p.photo}" alt="รูปจุด${esc(p.type)}">` : ''}
    ${(p.depth || p.pipe || dist) ? `<div class="facts">
      ${p.depth ? `<div class="fact"><span>ความลึก</span><b>${esc(p.depth)} ซม.</b></div>` : ''}
      ${p.pipe ? `<div class="fact"><span>ท่อ</span><b>${esc(p.pipe)}</b></div>` : ''}
      ${dist ? `<div class="fact"><span>ห่างจากคุณ</span><b>${dist}</b></div>` : ''}</div>` : ''}
    ${p.note ? `<p class="note">${esc(p.note)}</p>` : ''}
    <div class="meta">${fmtDate(p.createdAt)}<br>${p.lat.toFixed(6)}, ${p.lng.toFixed(6)} · ${esc(p.source)}</div>
    <div class="actions">
      <a class="btn primary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}"><svg class="i"><use href="#i-nav"/></svg>นำทางไปจุดนี้</a>
      <button class="btn danger" id="dDel" aria-label="ลบจุดนี้"><svg class="i"><use href="#i-trash"/></svg></button>
    </div>`;
  d.scrollTop = 0; d.classList.add('on'); document.body.classList.add('sheet-open');
  $('dClose').onclick = closeDetail;
  let armT; const del = $('dDel');
  del.onclick = async () => {
    if (!del.classList.contains('arm')) {
      del.classList.add('arm'); del.innerHTML = 'ยืนยันลบ'; armT = setTimeout(() => { del.classList.remove('arm'); del.innerHTML = '<svg class="i"><use href="#i-trash"/></svg>'; }, 3000); return; }
    clearTimeout(armT);
    await DB.del(p.id); markers.get(p.id).remove(); markers.delete(p.id); pinData.delete(p.id); selected = null;
    closeDetail(); refresh(); toast('ลบแล้ว');
  };
}
function closeDetail() {
  $('detail').classList.remove('on');
  if (!$('dlgSave').open && !$('dlgList').open) document.body.classList.remove('sheet-open');
  if (selected && markers.has(selected)) markers.get(selected).setIcon(pinIcon(pinData.get(selected).type, false));
  selected = null;
}

function refresh() {
  const n = markers.size;
  $('count').textContent = n ? `${n} จุดที่บันทึกไว้` : 'ยังไม่มีจุด';
  $('listCount').textContent = n;
  document.body.classList.toggle('empty', n === 0);
}

// ---------- List ----------
let filter = null;
function renderList() {
  const counts = {}; pinData.forEach(p => counts[p.type] = (counts[p.type] || 0) + 1);
  $('filters').innerHTML = `<button aria-pressed="${!filter}" data-k="">ทั้งหมด ${pinData.size}</button>` +
    TYPES.filter(t => counts[t.k]).map(t => `<button aria-pressed="${filter === t.k}" data-k="${t.k}"><i class="dot" style="background:${t.c}"></i>${t.k} ${counts[t.k]}</button>`).join('');
  $('filters').querySelectorAll('button').forEach(b => b.onclick = () => { filter = b.dataset.k || null; renderList(); });
  const here = me ? L.latLng(me.lat, me.lng) : null;
  let pins = [...pinData.values()].filter(p => !filter || p.type === filter).map(p => ({ p, d: here ? here.distanceTo([p.lat, p.lng]) : null }));
  pins.sort((a, b) => here ? a.d - b.d : b.p.createdAt.localeCompare(a.p.createdAt));
  $('listTitle').textContent = here ? 'จุดใกล้คุณ' : 'จุดที่บันทึกไว้';
  $('list').innerHTML = pins.length ? pins.map(({ p, d }) => `<button class="item" data-id="${p.id}">
    ${p.photo ? `<img class="th" src="${p.photo}" alt="">` : `<span class="th"><svg class="i"><use href="#i-pin"/></svg></span>`}
    <span class="tx"><b><i class="dot" style="background:${colorOf(p.type)}"></i>${esc(p.type)}</b><p>${esc(p.note || p.pipe || fmtDate(p.createdAt))}</p></span>
    ${d != null ? `<span class="dist">${fmtDist(d)}</span>` : ''}</button>`).join('')
    : `<div class="empty-list">ยังไม่มีจุดในรายการนี้<br>กดถ่ายรูปที่หน้าแผนที่เพื่อเริ่มบันทึก</div>`;
  $('list').querySelectorAll('.item').forEach(el => el.onclick = () => { $('dlgList').close(); select(el.dataset.id, true); });
}
$('btnList').onclick = () => { renderList(); document.body.classList.add('sheet-open'); $('dlgList').showModal(); };
$('listClose').onclick = () => $('dlgList').close();
$('dlgList').addEventListener('close', () => { if (!$('detail').classList.contains('on')) document.body.classList.remove('sheet-open'); });
// tap on backdrop closes sheets
['dlgList', 'dlgSave'].forEach(id => $(id).addEventListener('click', e => { if (e.target.id === id) $(id).close(id === 'dlgSave' ? 'cancel' : ''); }));

$('btnExport').onclick = async () => {
  const blob = new Blob([JSON.stringify(await DB.all())], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `pipe-pins-${new Date().toISOString().slice(0, 10)}.json`; a.click();
};
$('importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const pins = JSON.parse(await f.text());
    for (const p of pins) { await DB.put(p); if (!markers.has(p.id)) addMarker(p); }
    refresh(); renderList(); toast(`นำเข้า ${pins.length} จุดแล้ว`);
  } catch { toast('ไฟล์นี้อ่านไม่ได้'); }
  e.target.value = '';
};

// ---------- AR camera view ----------
const arEl = $('ar'), arLayer = $('arLayer'), arVideo = $('arVideo');
const ar = { on: false, raf: 0, stream: null, raw: null, s: {}, yawT: 0, yaw: 0, got: false, rel: false, range: 100, els: new Map(), t0: 0, tick: 0, nearest: null, aimed: null };
const AR_RANGES = [30, 100, 500, Infinity], CAM_H = 1.4, CAM_LONG_FOV = 65, RAD = Math.PI / 180;
const norm = a => ((a % 360) + 360) % 360, sdiff = (a, b) => ((a - b + 540) % 360) - 180, clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const dirName = a => ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(a / 45) % 8];
const rangeLabel = r => r === Infinity ? 'ทั้งหมด' : `${r} ม.`;

// manual corrections the user can set against a known pin (expire after 1 h / 500 m)
let cal = { dLat: 0, dLng: 0, azOff: 0, t: 0, lat: 0, lng: 0 };
function loadCal() {
  try { const c = JSON.parse(localStorage.getItem('pp-cal') || 'null');
    if (c && Date.now() - c.t < 3600e3 && (!me || L.latLng(me.lat, me.lng).distanceTo([c.lat, c.lng]) < 500)) { cal = c; return; } } catch {}
  cal = { dLat: 0, dLng: 0, azOff: 0, t: 0, lat: 0, lng: 0 };
}
function saveCal() { cal.t = Date.now(); if (me) { cal.lat = me.lat; cal.lng = me.lng; } try { localStorage.setItem('pp-cal', JSON.stringify(cal)); } catch {} }
const isCal = () => cal.t && (cal.dLat || cal.dLng || cal.azOff);

// Device attitude -> camera axes in a East/North/Up world (W3C rotation matrix). Handles pitch AND roll.
function onOrient(e) {
  const ios = e.webkitCompassHeading;
  if (e.beta == null || e.gamma == null) return;
  if (!e.absolute && ios == null) { ar.rel = true; return; }          // no true north on this sensor
  const a = (e.alpha || 0) * RAD, b = e.beta * RAD, g = e.gamma * RAD;
  const sA = Math.sin(a), cA = Math.cos(a), sB = Math.sin(b), cB = Math.cos(b), sG = Math.sin(g), cG = Math.cos(g);
  const R = [cA * cG - sA * sB * sG, cG * sA + cA * sB * sG, -cB * sG];             // screen right
  const U = [-cB * sA, cA * cB, sB];                                                // screen up
  const F = [-(cA * sG + cG * sA * sB), -(sA * sG - cA * cG * sB), -(cB * cG)];     // out of the back camera
  ar.raw = { R, U, F }; ar.got = true;
  if (ios != null && Math.abs(F[2]) < .6) ar.yawT = sdiff(ios, Math.atan2(F[0], F[1]) / RAD);   // iOS: re-anchor to true north
}
function arPinEl(p) {
  let el = ar.els.get(p.id);
  if (el) return el;
  el = document.createElement('button'); el.className = 'ar-m';
  el.innerHTML = `<span class="ar-card">${p.photo ? `<img src="${p.photo}" alt="">` : ''}<span class="nm"><b>${esc(p.type)}</b><small></small></span><svg class="i chev"><use href="#i-chev"/></svg></span>
    <svg class="ar-glyph" viewBox="0 0 34 42"><path d="M17 41S3.5 26 3.5 16a13.5 13.5 0 0 1 27 0C30.5 26 17 41 17 41z" fill="${colorOf(p.type)}" stroke="#fff" stroke-width="2.5"/><circle cx="17" cy="16" r="5.5" fill="#fff"/></svg>`;
  el.querySelector('small').dataset.k = '';
  el.onclick = () => select(p.id, false);
  arLayer.appendChild(el); ar.els.set(p.id, el); return el;
}
// focal length in screen pixels, from the real video size (object-fit: cover crops the sides)
function arFocal(W, H) {
  const vw = arVideo.videoWidth, vh = arVideo.videoHeight;
  if (vw && vh && !arEl.classList.contains('nocam')) return (Math.max(vw, vh) / 2) / Math.tan(CAM_LONG_FOV / 2 * RAD) * Math.max(W / vw, H / vh);
  return (W / 2) / Math.tan(20 * RAD);
}
function arFrame() {
  if (!ar.on) return; ar.raf = requestAnimationFrame(arFrame);
  const W = arEl.clientWidth, H = arEl.clientHeight;
  if (ar.raw) {
    for (const k of ['F', 'U', 'R']) {
      const sv = ar.s[k]; if (!sv) { ar.s[k] = ar.raw[k].slice(); continue; }
      for (let i = 0; i < 3; i++) sv[i] += (ar.raw[k][i] - sv[i]) * .25;
      const n = Math.hypot(...sv) || 1; for (let i = 0; i < 3; i++) sv[i] /= n;
    }
    ar.yaw += sdiff(ar.yawT, ar.yaw) * .2;
  }
  const S = ar.s, ready = !!S.F;
  const camAz = ready ? norm(Math.atan2(S.F[0], S.F[1]) / RAD + ar.yaw + cal.azOff) : null;
  const gp = livePos();                                      // steadier than the raw latest fix
  const eff = gp ? { lat: gp.lat + cal.dLat, lng: gp.lng + cal.dLng, acc: gp.acc } : null;
  $('arHead').textContent = camAz == null ? '--°' : `${Math.round(camAz)}° ${dirName(camAz)}`;
  $('arGps').textContent = gp ? `GPS ±${Math.round(gp.acc)} ม.${isCal() ? ' · ปรับแล้ว' : ''}` : 'GPS …';
  let hint = '';
  const hide = () => ar.els.forEach(e => e.hidden = true);
  if (!eff) { hint = 'กำลังหาตำแหน่ง GPS…'; hide(); }
  else if (!ready) {
    hide();
    hint = performance.now() - ar.t0 < 3000 ? 'กำลังอ่านเข็มทิศ…' : ar.rel
      ? 'เครื่องนี้อ่านทิศเหนือจริงไม่ได้ · ลองขยับมือถือเป็นเลข 8 หรือใช้มือถือเครื่องอื่น'
      : 'ไม่พบเซนเซอร์เข็มทิศ · มุมมองนี้ใช้ได้บนมือถือเท่านั้น';
  } else {
    const f = arFocal(W, H), cosLat = Math.cos(eff.lat * RAD), yawAll = ar.yaw + cal.azOff;
    const items = [];
    pinData.forEach(p => {
      const dy = (p.lat - eff.lat) * 111320, dx = (p.lng - eff.lng) * 111320 * cosLat, dist = Math.hypot(dx, dy);
      if (dist > ar.range) return;
      const brg = norm(Math.atan2(dx, dy) / RAD), b = (brg - yawAll) * RAD, e = -Math.atan2(CAM_H, Math.max(dist, 1));   // pin lies on the ground
      const t = [Math.sin(b) * Math.cos(e), Math.cos(b) * Math.cos(e), Math.sin(e)];
      items.push({ p, dist, brg, xc: dot(t, S.R), yc: dot(t, S.U), zc: dot(t, S.F) });
    });
    items.sort((a, b) => a.dist - b.dist);
    const seen = new Set(); let edges = 0; ar.aimed = null; let bestAim = 1e9;
    for (const it of items) {
      const el = arPinEl(it.p); seen.add(it.p.id);
      let x = W / 2 + f * it.xc / Math.max(it.zc, .001), y = H / 2 - f * it.yc / Math.max(it.zc, .001);
      const on = it.zc > .05 && x > 20 && x < W - 20;
      const dAz = Math.abs(sdiff(it.brg, camAz)); if (it.dist >= 3 && dAz < bestAim) { bestAim = dAz; ar.aimed = { ...it, dAz }; }
      if (!on) {
        if (edges++ >= 4) { el.hidden = true; continue; }
        const right = it.xc >= 0; x = right ? W - 14 : 14; y = it.zc > .05 ? clamp(y, H * .3, H * .7) : H * .5;
        el.className = 'ar-m edge ' + (right ? 'r' : 'l');
      } else { y = clamp(y, 120, H - 60); el.className = 'ar-m'; }
      el.hidden = false;
      const sc = on ? clamp(1.25 - it.dist / 200, .7, 1.25) : 1;
      el.style.transform = `translate3d(${x}px,${y}px,0) scale(${sc})`;
      el.style.zIndex = String(1000 - Math.min(999, Math.round(it.dist)));
      const unc = Math.round(Math.hypot(it.p.acc ?? 8, eff.acc));
      const sm = el.querySelector('small'), t = `${fmtDist(it.dist)} · ±${unc}`;
      if (sm.dataset.k !== t) { sm.dataset.k = t; sm.textContent = t; }
    }
    ar.els.forEach((e, id) => { if (!seen.has(id)) e.hidden = true; });
    ar.nearest = null; pinData.forEach(p => { const d = L.latLng(eff.lat, eff.lng).distanceTo([p.lat, p.lng]); if (!ar.nearest || d < ar.nearest.d) ar.nearest = { p, d }; });
    const el0 = Math.asin(clamp(S.F[2], -1, 1)) / RAD;
    if (el0 < -55) hint = 'ยกมือถือตั้งตรง แล้วหันกล้องไปข้างหน้า';
    else if (!items.length) hint = pinData.size ? `ไม่มีจุดในระยะ ${rangeLabel(ar.range)} · กดปุ่มระยะเพื่อขยาย` : 'ยังไม่มีจุดที่บันทึกไว้';
    else if (eff.acc > 20) hint = `GPS คลาดเคลื่อน ±${Math.round(eff.acc)} ม. · หมุดอาจเพี้ยน ลองไปที่โล่งแจ้ง`;
    else if (performance.now() - ar.t0 < 6000) hint = 'หันกล้องไปทางจุดที่บันทึกไว้ · ถ้าหมุดไม่ตรง กด "ปรับให้ตรง"';
  }
  if (!$('arCal').hidden && ++ar.tick % 6 === 0) renderCal();
  const h = $('arHint'); if (h.textContent !== hint) h.textContent = hint;
}
function renderCal() {
  const n = ar.nearest, a = ar.aimed;
  $('calA').textContent = n && n.d <= 25 ? `ใกล้คุณสุด: ${n.p.type} (ห่าง ${fmtDist(n.d)})` : 'ต้องยืนใกล้หมุดที่รู้ตำแหน่งแน่ ๆ ไม่เกิน 25 ม.';
  $('calAbtn').disabled = !(n && n.d <= 25);
  $('calB').textContent = a && a.dAz <= 40 ? `หมุดที่ตรงทิศที่สุด: ${a.p.type} (${fmtDist(a.dist)})` : 'หันกล้องไปทางหมุดที่อยู่ไกลกว่า 3 ม.';
  $('calBbtn').disabled = !(a && a.dAz <= 40);
  const m = Math.hypot(cal.dLat * 111320, cal.dLng * 111320 * Math.cos((me?.lat || 0) * RAD));
  $('calS').textContent = isCal() ? `ปรับแล้ว: ตำแหน่ง ${m.toFixed(1)} ม. · ทิศ ${cal.azOff >= 0 ? '+' : ''}${cal.azOff.toFixed(0)}°` : 'ยังไม่ได้ปรับ';
}
$('arCalBtn').onclick = () => { $('arCal').hidden = false; $('arCalBtn').hidden = true; $('arHint').style.display = 'none'; renderCal(); };
function closeCal() { $('arCal').hidden = true; $('arCalBtn').hidden = false; $('arHint').style.display = ''; }
$('calClose').onclick = closeCal;
$('calAbtn').onclick = () => {                      // "I'm standing at this pin" -> fix GPS bias
  const n = ar.nearest, gp = livePos(); if (!n || !gp) return;
  cal.dLat = n.p.lat - gp.lat; cal.dLng = n.p.lng - gp.lng; saveCal(); renderCal(); toast('ปรับตำแหน่งแล้ว');
};
$('calBbtn').onclick = () => {                      // "this pin is straight ahead" -> fix compass bias
  const a = ar.aimed; if (!a || !ar.s.F) return;
  const cur = norm(Math.atan2(ar.s.F[0], ar.s.F[1]) / RAD + ar.yaw + cal.azOff);
  cal.azOff += sdiff(a.brg, cur); saveCal(); renderCal(); toast('ปรับทิศแล้ว');
};
$('calReset').onclick = () => { cal = { dLat: 0, dLng: 0, azOff: 0, t: 0, lat: 0, lng: 0 }; try { localStorage.removeItem('pp-cal'); } catch {} renderCal(); };

async function openAR() {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try { if (await DeviceOrientationEvent.requestPermission() !== 'granted') toast('ต้องอนุญาตเซนเซอร์เข็มทิศ'); } catch {}
  }
  closeDetail(); loadCal(); Object.assign(ar, { on: true, raw: null, s: {}, yaw: 0, yawT: 0, got: false, rel: false, t0: performance.now() });
  arEl.hidden = false; arEl.classList.remove('nocam'); closeCal();
  window.addEventListener('deviceorientationabsolute', onOrient);
  window.addEventListener('deviceorientation', onOrient);
  try {
    ar.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    arVideo.srcObject = ar.stream; arVideo.play().catch(() => {});
  } catch { arEl.classList.add('nocam'); toast('เปิดกล้องไม่ได้ · ใช้มุมมองเข็มทิศแทน'); }
  if (!me) getFreshPos();
  arFrame();
}
function closeAR() {
  ar.on = false; cancelAnimationFrame(ar.raf);
  window.removeEventListener('deviceorientationabsolute', onOrient); window.removeEventListener('deviceorientation', onOrient);
  ar.stream?.getTracks().forEach(t => t.stop()); ar.stream = null; arVideo.srcObject = null;
  arLayer.innerHTML = ''; ar.els.clear(); arEl.hidden = true;
}
$('btnAR').onclick = openAR; $('arClose').onclick = closeAR;
$('arRange').onclick = () => { ar.range = AR_RANGES[(AR_RANGES.indexOf(ar.range) + 1) % AR_RANGES.length]; $('arRangeTxt').textContent = rangeLabel(ar.range); };
addEventListener('keydown', e => { if (e.key === 'Escape' && ar.on) closeAR(); });

// ---------- Init ----------
DB.all().then(pins => {
  pins.forEach(addMarker); refresh();
  if (pins.length) map.fitBounds(L.latLngBounds(pins.map(p => [p.lat, p.lng])).pad(0.3), { maxZoom: 18 });
});
</script>
</body>
</html>
